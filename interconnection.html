function bytes(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0);});}
function showBox(){var b=document.getElementById('box');if(b){b.style.visibility='visible';var i=document.getElementById('pw');if(i)i.focus();}}
async function unlock(pw,silent){
  var e=document.getElementById('e');if(e)e.textContent='';
  try{
    var bk=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(SALT),iterations:100000,hash:'SHA-256'},bk,{name:'AES-GCM',length:256},false,['decrypt']);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(IV)},key,bytes(DATA));
    try{localStorage.setItem(PWKEY,pw);}catch(_){}
    document.open();document.write(new TextDecoder().decode(pt));document.close();
  }catch(err){
    try{localStorage.removeItem(PWKEY);}catch(_){}
    showBox();
    if(!silent&&e)e.textContent='Incorrect password';
  }
}
function go(){unlock(document.getElementById('pw').value,false);}
// If a saved password exists, try it silently while the box stays hidden (no flash).
